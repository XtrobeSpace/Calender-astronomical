name: Daily Dynamic Calendar Sync

on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = 12:00 AM Midnight IST (Runs daily at Midnight IST)
  push:
    branches: [ main ]      # Runs immediately when code is uploaded/pushed to GitHub
  workflow_dispatch:        # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Skyfield & Telemetry Cache
        uses: actions/cache@v4
        with:
          path: skyfield_cache/
          key: skyfield-de440s-${{ hashFiles('shared.py') }}
          restore-keys: |
            skyfield-de440s-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield astronomy-engine requests numpy

      - name: Run fast daily dynamic sync
        run: |
          # Automatic retry with exponential backoff on network issues
          for i in 1 2 3; do
            echo "Attempt $i to execute generate_daily.py..."
            python generate_daily.py && break || sleep $((i * 10))
          done

      - name: Commit and push updated daily_events.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/daily_events.json skyfield_cache/resolved_objects_cache.json
          git diff-index --quiet HEAD || git commit -m "Auto-update daily_events.json [skip ci]"
          git push
